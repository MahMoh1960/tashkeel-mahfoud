name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg icon-512.png www/

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/share@8
          npx cap init "المُشكِّل العربي" com.mahmoh.tashkeel --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          declare -A L=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for d in "${!L[@]}"; do
            s=${L[$d]}; f=$((s*9/4)); c=$((f*2/3))
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher_round.png
            convert -size ${f}x${f} xc:'#0f766e' \( icon-512.png -resize ${c}x${c} \) -gravity center -composite $RES/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#0f766e/I' $RES/values/ic_launcher_background.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tashkeel.apk

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tashkeel-apk
          path: tashkeel.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: tashkeel.apk
